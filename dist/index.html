    <script>
      // Resolve the theme BEFORE React mounts so the page paints
      // with the correct colors. Priority:
      //   1. localStorage('theme') if set (user's explicit choice)
      //   2. matchMedia('(prefers-color-scheme: dark)') for first visit
      //   3. 'light' as the final fallback
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
            return;
          }
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute(
            'data-theme',
            prefersDark ? 'dark' : 'light'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
