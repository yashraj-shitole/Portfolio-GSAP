<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13151a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Portfolio of Yashraj Shitole — full-stack software engineer (Angular, MERN, Spring Boot)." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f7f4eb'/><text x='50' y='66' text-anchor='middle' font-family='Georgia,serif' font-size='52' font-weight='500' fill='%231c1c20'>YS</text></svg>" />
    <title>Yashraj Shitole — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Resolve the theme BEFORE React mounts so the page paints
      // with the correct colors. Priority:
      //   1. localStorage('theme') if set (user's explicit choice)
      //   2. matchMedia('(prefers-color-scheme: dark)') for first visit
      //   3. 'light' as the final fallback
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
            return;
          }
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute(
            'data-theme',
            prefersDark ? 'dark' : 'light'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
